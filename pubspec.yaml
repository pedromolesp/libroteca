name: tomora
description: "Tomora: inventario de libros compartido con valoraciones y traduccion."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

module:
  androidX: true
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado + inyección de dependencias (estilo Planogether)
  flutter_bloc: ^9.1.1
  get_it: ^9.0.5
  go_router: ^18.0.0

  # Backend Firebase (andamiaje: se activa al ejecutar `flutterfire configure`)
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  firebase_app_check: ^0.4.7

  # Anuncios
  google_mobile_ads: ^9.1.0
  app_tracking_transparency: ^2.0.7

  # Persistencia local / utilidades
  sqflite: ^2.2.6
  path: ^1.9.0
  path_provider: ^2.0.14
  shared_preferences: ^2.1.0
  file_picker: ^12.1.2
  fluttertoast: ^10.0.0
  http: ^1.6.0
  intl: ^0.20.2
  auto_size_text: ^3.0.0
  cupertino_icons: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  image_path: "assets/images/libro-logo.png"
  ios: true
  android: true

flutter:

  uses-material-design: true
  generate: true # Genera AppLocalizations a partir de lib/l10n/*.arb

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/images/

  fonts:
  - family: muli-extra-bold
    fonts:
    - asset: assets/fonts/Muli-ExtraBold.ttf
   
  - family: muli-black
    fonts:
    - asset: assets/fonts/Muli-Black.ttf
  - family: muli-extra-light
    fonts:
    - asset: assets/fonts/Muli-ExtraLight.ttf
  
  - family: muli-bold
    fonts:
    - asset: assets/fonts/Muli-Bold.ttf
  - family: muli-italic
    fonts:
    - asset: assets/fonts/Muli-Italic.ttf
  - family: muli-light
    fonts:
    - asset: assets/fonts/Muli-Light.ttf
  - family: muli-medium
    fonts:
    - asset: assets/fonts/Muli-Medium.ttf
  - family: muli-regular
    fonts:
    - asset: assets/fonts/Muli-Regular.ttf
  - family: muli-semi-bold
    fonts:
    - asset: assets/fonts/Muli-SemiBold.ttf

