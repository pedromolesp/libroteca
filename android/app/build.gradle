plugins {
    id "com.android.application"
    // El Flutter Gradle Plugin va después de los plugins de Android y Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
    // Aplica google-services.json (versión declarada en android/build.gradle).
    id "com.google.gms.google-services"
    // TODO(tomora): activar junto al plugin de android/build.gradle.
    // id "com.google.firebase.crashlytics"
}

android {
    namespace = "com.pedrogrameitor.tomora"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.pedrogrameitor.tomora"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Firma con las claves de debug por ahora, para que `flutter run
            // --release` funcione. TODO(tomora): config de firma real.
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    // BoM de Firebase: fija versiones coherentes; no pongas versión en las
    // dependencias de Firebase de abajo.
    implementation platform("com.google.firebase:firebase-bom:34.18.0")
    implementation "com.google.firebase:firebase-analytics"
}
