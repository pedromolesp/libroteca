plugins {
    // Plugin de Gradle de Google Services: lee android/app/google-services.json
    // y lo convierte en los recursos que Firebase necesita en tiempo de compilación.
    id "com.google.gms.google-services" version "4.5.0" apply false
    // TODO(tomora): activar cuando se quiera subida de símbolos de Crashlytics.
    // id "com.google.firebase.crashlytics" version "3.0.8" apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete(rootProject.layout.buildDirectory)
}
